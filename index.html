            <button onclick="showResult('주MONY')" class="opt-btn">🍺 건전한 음주문화 정착 캠페인</button>
            <button onclick="showResult('난공불락')" class="opt-btn">☕ 취향 맞는 부원들과의 자유 친목</button>`;
        } else if (selectedCategory === '봉사') {
          optionsHtml = `
            <button onclick="showResult('감염예방동아리')" class="opt-btn">🦠 지역사회 협력 감염 예방 보건 봉사</button>
            <button onclick="showResult('심봉사')" class="opt-btn">🩺 예비 의료인 관련 진료 교육 연계 봉사</button>
            <button onclick="showResult('사랑의 RCY')" class="opt-btn">🔴 적십자 이념을 실천하는 다채로운 봉사</button>
            <button onclick="showResult('아름드리')" class="opt-btn">🌳 부원 간 따뜻한 협력과 사회적 연대</button>`;
        } else if (selectedCategory === '종교') {
          optionsHtml = `
            <button onclick="showResult('CMF')" class="opt-btn">🩺 예비 의료인을 위한 신앙 모임</button>
            <button onclick="showResult('LUX(룩스)')" class="opt-btn">💪 건강한 몸과 마음을 기르는 신앙</button>
            <button onclick="showResult('CCC')" class="opt-btn">✝️ 캠퍼스 선교 및 하나님의 사랑 전파</button>
            <button onclick="showResult('DFC')" class="opt-btn">🕊️ 제자 훈련 중심의 청년 선교 모임</button>`;
        }
      }

      container.innerHTML = `
        <h2 class="text-lg font-bold text-gray-700 mb-4">Q3. 어떤 세부 활동이 가장 마음에 드시나요?</h2>
        <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
          ${optionsHtml}
        </div>
      `;
    }

    function showResult(clubName) {
      updateProgress(100);
      const club = clubs[clubName];
      const container = document.getElementById('quiz-container');

      container.innerHTML = `
        <div class="text-center animate-fade-in">
          <div class="text-4xl mb-2">🎉</div>
          <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">${club.campus}캠퍼스 | ${club.category}분과</span>
          <h2 class="text-3xl font-extrabold text-gray-900 mt-3 mb-1">${clubName}</h2>
          <p class="text-sm font-semibold text-gray-500 mb-4">📍 동아리방: ${club.loc}</p>
          
          <div class="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100 text-left mb-6">
            <p class="text-xs text-emerald-600 font-bold mb-1">동아리 소개</p>
            <p class="text-sm text-gray-700 leading-relaxed">${club.desc}</p>
          </div>

          <div class="bg-emerald-100 border border-emerald-300 p-3 rounded-xl mb-4 text-xs text-emerald-900">
            📸 <b>이 화면을 캡처해서</b> 총동아리연합회 부스로 오시면 이벤트 뽑기권/상품을 드립니다!
          </div>

          <button onclick="renderStep1()" class="w-full py-3 bg-emerald-700 text-white rounded-xl font-bold hover:bg-emerald-800 transition shadow-md">
            🔄 다시 검사하기
          </button>
        </div>
      `;
    }

    // 초록색 테마 CSS 스타일 적용
    const style = document.createElement('style');
    style.innerHTML = `
      .opt-btn {
        width: 100%;
        text-align: left;
        padding: 0.75rem 1rem;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        color: #334155;
        font-weight: 500;
        transition: all 0.2s;
      }
      .opt-btn:hover {
        background-color: #dcfce7;
        border-color: #4ade80;
        color: #15803d;
      }
    `;
    document.head.appendChild(style);

    // Initial render
    renderStep1();
  </script>
</body>
</html>
