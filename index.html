<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4 md:p-8">

  <!-- 메인 컨테이너 너비를 max-w-4xl로 대폭 확대하여 소개글 공간 확보 -->
  <div id="main-card" class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden p-6 md:p-10 relative transition-all duration-300">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <span class="text-xs md:text-sm font-semibold bg-emerald-100 text-emerald-700 px-3.5 py-1.5 rounded-full">2026 건양대학교 한솔대동제</span>
      <h1 class="text-2xl md:text-4xl font-extrabold text-gray-800 mt-3">🎯 나에게 딱 맞는<br class="md:hidden"> 동아리 찾기</h1>
    </div>

    <!-- Progress Bar -->
    <div id="progress-wrapper" class="w-full bg-gray-200 h-2.5 rounded-full mb-8 overflow-hidden max-w-xl mx-auto">
      <div id="progress" class="bg-emerald-500 h-full w-[11%] transition-all duration-300"></div>
    </div>

    <!-- Dynamic Content Area -->
    <div id="quiz-container" class="max-w-2xl mx-auto">
      <!-- Questions & Results will be rendered here dynamically -->
    </div>

  </div>

        { name: '만두전골', loc: '미정 (가동아리)', desc: '주짓수 연합 훈련 및 실전 기술 습득으로 심신을 단련합니다.' },
        { name: '볼매', loc: '미정 (가동아리)', desc: '핀을 쓰러뜨리는 쾌감과 볼링 실력 향상, 내적 친밀감 형성!' },

        { name: 'RIP', loc: '미정', desc: '공연 준비 및 라이브 밴드 합주를 통해 끈끈한 친밀감 형성.' },
        { name: '난공불락', loc: '명곡의학관 B08', desc: '공동의 관심사를 나누며 깊은 우정과 단합을 다집니다.' },
        { name: '노말피플', loc: '명곡의학관 B03', desc: '목소리만으로 아름다운 하모니를 만들어내는 아카펠라 팀!' },
        { name: '메디씨네', loc: '미정', desc: '함께 영화를 감상하고 나누며 다양한 시각과 친목을 도모합니다.' },
        { name: '메타스타시스', loc: '명곡의학관 B06', desc: '강렬한 사운드의 밴드 합주와 무대 공연 준비 모임.' },
        { name: '보들보들', loc: '명곡의학관 B10', desc: '다양한 보드게임을 즐기며 학업 스트레스를 싹 날려버리기!' },
        { name: '일루션', loc: '짐나지움 204', desc: '그림과 미술 작품 활동을 통해 문화적 교류를 함께합니다.' },
        { name: '제식이', loc: '짐나지움 207/208', desc: '서로 다른 목소리로 감동과 즐거움을 선사하는 보컬 동아리!' },
        { name: '주MONY', loc: '명곡의학관 B08', desc: '건전하고 즐거운 음주 문화 정착 및 예방 캠페인 활동.' },
        { name: '천지음', loc: '명곡의학관 B11', desc: '흥겨운 우리 가락 풍물을 통해 신나는 신체와 건강한 정신!' },
        { name: '클레프', loc: '명곡의학관 B03', desc: '다양한 악기 연주 실력 향상과 클래식/세션 합주 활동.' },
        { name: '포토박스', loc: '짐나지움 302', desc: '카메라 사진 촬영 지식 습득 및 감성적인 편집 기술 배우기.' },
        { name: '엉거크루', loc: '짐나지움 303', desc: '에너지 넘치는 댄스 퍼포먼스로 실력과 자존감 UP!' },
        { name: '후룩', loc: '명곡의학관 B04', desc: '활력 넘치는 스트릿 댄스 라이프와 멋진 무대 공연!' }
      ],
      '봉사': [
        { name: '감염예방동아리', loc: '미정', desc: '지역사회와 협력하여 보건 건강 및 감염 예방 봉사 추진.' },
        { name: '사랑의 RCY', loc: '명곡의학관 B07', desc: '적십자 인도주의 이념을 실천하는 다채로운 나눔 활동.' },
        { name: '새마을봉사동아리', loc: '미정', desc: '살기 좋은 나눔 공동체를 만드는 건강한 봉사 문화 조성.' },
        { name: '심봉사', loc: '명곡의학관 B11', desc: '정기적인 사회 봉사 참여 및 따뜻한 진료 봉사 교육 연계.' },
        { name: '아름드리', loc: '명곡의학관 B05', desc: '부원 간 협력을 통해 따뜻한 사회적 연대감과 나눔 형성.' },
        { name: '품앗이', loc: '짐나지움 314', desc: '지속적인 봉사활동을 통해 뿌듯한 보람과 성장을 도모.' }
      ],
      '종교': [
        { name: 'CCC', loc: '짐나지움 316/317', desc: '캠퍼스에서 따뜻한 사랑과 선교를 전하는 공동체.' },
        { name: 'CMF', loc: '명곡의학관 B12', desc: '신앙 성장을 돕고 따뜻한 사회를 만들어가는 모임.' },
        { name: 'DFC', loc: '짐나지움 315', desc: '캠퍼스 선교를 목표로 서로 도우며 성장하는 청년 모임.' },
        { name: 'JDM', loc: '짐나지움 310', desc: '복음 전파 및 리더십 훈련을 통해 바로 서는 모임.' },
        { name: 'LUX(룩스)', loc: '명곡의학관 203', desc: '건강한 몸과 마음을 기르며 신앙심을 키워나가는 모임.' },
        { name: '에파타', loc: '짐나지움 321', desc: '천주교 신자 교우들의 신앙 고취 및 따뜻한 친목 모임.' }
      ]

    // 9개 질문 데이터
    const questions = [
      {
        q: "Q1. 금요일 마지막 수업이 끝난 후, 당신이 꿈꾸는 완벽한 저녁은?",
        options: [
          { text: "땀 뻘뻘 흘리며 사람들과 함께 에너지를 발산하기", type: "체육" },
          { text: "조용한 곳에서 나만의 감성이나 취미에 몰입하기", type: "문화" },
          { text: "마음 맞는 사람들과 시원한 음료 한 잔 나누며 수다 떨기", type: "문화" },
          { text: "보람찬 일로 하루를 마무리하며 남을 돕기", type: "봉사" }
        ]
      },
      {
        q: "Q2. 새로운 모임이나 그룹에 들어갔을 때 당신의 모습은?",
        options: [
          { text: "먼저 분위기를 주도하며 사람들을 끌어모는다.", type: "체육" },
          { text: "조용히 관찰하다가 친해진 몇몇과 깊게 교류한다.", type: "문화" },
          { text: "모두가 즐거울 수 있도록 뒤에서 묵묵히 지원하고 챙겨준다.", type: "봉사" },
          { text: "공통의 목표나 미션이 주어졌을 때 열정이 타오른다.", type: "종교" }
        ]
      },
      {
        q: "Q3. 스트레스가 극에 달했을 때, 가장 끌리는 해소법은?",
        options: [
          { text: "몸을 격렬하게 움직이거나 소리를 지른다.", type: "체육" },
          { text: "음악을 듣거나 무언가를 새로 만들어내며 마음을 다스린다.", type: "문화" },
          { text: "친구들과 모여 게임을 하거나 영화를 보며 딴생각을 한다.", type: "문화" },
          { text: "마음의 평화를 찾을 수 있는 차분하고 영적인 시간에 집중한다.", type: "종교" }
        ]
      },
      {
        q: "Q4. 과제나 팀 프로젝트를 할 때 당신의 강점은?",
        options: [
          { text: "탁월한 순발력과 행동력으로 빠르게 기획하고 실행하기", type: "체육" },
          { text: "남다른 감각과 디테일로 완성도 높이기", type: "문화" },
          { text: "팀원들의 의견을 경청하고 조화롭게 중재하기", type: "봉사" },
          { text: "약자를 배려하고 꼼꼼하게 챙기는 포용력", type: "봉사" }
        ]
      },
      {
        q: "Q5. 주말에 야외로 나갈 때, 당신이 꼭 챙기는 것은?",
        options: [
          { text: "편안한 운동화와 넘치는 체력", type: "체육" },
          { text: "카메라, 이어폰, 또는 나만의 감성 아이템", type: "문화" },
          { text: "여럿이 나누어 먹을 간식과 유쾌한 입담", type: "문화" },
          { text: "나보다 주변을 챙길 수 있는 여유로운 마음", type: "봉사" }
        ]
      },
      {
        q: "Q6. 당신이 생각하는 '대학 생활의 낭만'이란?",
        options: [
          { text: "동료들과 함께 땀 흘리고 눈물 흘리는 뜨거운 도전에 참여하는 것", type: "체육" },
          { text: "무대 위나 작품 속에서 나만의 개성을 마음껏 표현해보는 것", type: "문화" },
          { text: "다양한 학과의 사람들과 끈끈한 인맥을 쌓고 추억을 만드는 것", type: "문화" },
          { text: "내 작은 손길로 누군가의 삶이나 사회에 긍정적인 변화를 주는 것", type: "봉사" }
        ]
      },
      {
        q: "Q7. 낯선 사람과 대화할 때 당신이 주로 건네는 말은?",
        options: [
          { text: "\"요즘 운동이나 활동적인 거 하시는 거 있으세요?\"", type: "체육" },
          { text: "\"혹시 어떤 음악/장르 좋아하세요?\"", type: "문화" },
          { text: "\"오늘 저녁에 맛있는 거 먹으러 갈래요?\"", type: "문화" },
          { text: "\"요즘 고민이나 힘든 일은 없으세요?\"", type: "봉사" }
        ]
      },
      {
        q: "Q8. 축제 기간 부스 체험을 한다면 가장 먼저 가고 싶은 곳은?",
        options: [
          { text: "상품이 걸린 미니 게임/체육 경기 부스", type: "체육" },
          { text: "버스킹 공연이나 전시회가 열리는 예술 부스", type: "문화" },
          { text: "맛있는 음식을 파는 주점이나 보드게임 부스", type: "문화" },
          { text: "수익금을 좋은 곳에 기부하는 릴레이 나눔 부스", type: "봉사" }
        ]
      },
      {
        q: "Q9. 당신을 가장 잘 표현하는 단어 하나를 고른다면?",
        options: [
          { text: "열정 (Action)", type: "체육" },
          { text: "감성 (Sensibility)", type: "문화" },
          { text: "친목 (Social)", type: "문화" },
          { text: "선의 (Kindness)", type: "봉사" }
        ]
      }
    ];

    let currentIdx = 0;
    let scores = { '체육': 0, '문화': 0, '봉사': 0, '종교': 0 };

    function updateProgress() {
      const percent = ((currentIdx + 1) / questions.length) * 100;
      document.getElementById('progress').style.width = percent + '%';
    }

    function renderQuestion() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.className = "max-w-2xl mx-auto"; // 질문 진행 중에는 중앙 정렬 폭 유지

      document.getElementById('progress-wrapper').style.display = 'block';
      if (currentIdx >= questions.length) {
        showResult();
        return;
      }

      updateProgress();
      const qData = questions[currentIdx];

      let optionsHtml = '';
      qData.options.forEach((opt) => {
        optionsHtml += `
          <button onclick="handleAnswer('${opt.type}')" class="w-full text-left p-4 bg-gray-50 border border-gray-200 rounded-2xl font-medium text-gray-700 hover:bg-emerald-50 hover:border-emerald-400 hover:text-emerald-700 transition text-base md:text-lg shadow-sm">
            ${opt.text}
          </button>
        `;
      });

      quizContainer.innerHTML = `
        <span class="text-sm font-bold text-emerald-600 mb-2 block">QUESTION ${currentIdx + 1} / ${questions.length}</span>
        <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-6 leading-snug">${qData.q}</h2>
        <div class="space-y-3">
          ${optionsHtml}
        </div>
      `;
    }

    function handleAnswer(type) {
      scores[type]++;
      currentIdx++;
      renderQuestion();
    }

    function showResult() {
      document.getElementById('progress-wrapper').style.display = 'none';

      const quizContainer = document.getElementById('quiz-container');
      quizContainer.className = "w-full"; // 결과창에서는 전체 폭 활용

      let sortedCategories = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      let topCategory = sortedCategories[0];
      let secondCategory = sortedCategories[1];

      let recommendedClubs = [...clubDatabase[topCategory]];
      if (recommendedClubs.length < 3) {
        recommendedClubs = recommendedClubs.concat(clubDatabase[secondCategory]);
      }
      
      // 랜덤 추출 (3개)
      recommendedClubs.sort(() => 0.5 - Math.random());
      let selectedClubs = recommendedClubs.slice(0, 3);

      let clubsHtml = '';
      selectedClubs.forEach(club => {
        clubsHtml += `
          <div class="bg-emerald-50/70 p-5 md:p-6 rounded-2xl border border-emerald-200/80 flex flex-col justify-between shadow-sm hover:shadow-md transition">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold bg-emerald-200/80 text-emerald-800 px-3 py-1 rounded-full">${topCategory} 분과</span>
              </div>
              <h3 class="text-xl font-extrabold text-gray-900 mb-1">${club.name}</h3>
              <p class="text-xs font-semibold text-emerald-700 mb-3">📍 ${club.loc}</p>
              
              <!-- 동아리 소개 문구 영역 (내용이 길어져도 깔끔하게 감싸줍니다) -->
              <p class="text-xs md:text-sm text-gray-600 leading-relaxed bg-white/80 p-3 rounded-xl border border-emerald-100 mb-4 min-h-[70px]">
                ${club.desc}
              </p>
            </div>

            <!-- 버튼 영역 -->
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-emerald-100">
              <a href="#" target="_blank" class="py-2.5 bg-pink-500 text-white rounded-xl text-xs md:text-sm font-bold text-center hover:bg-pink-600 transition shadow-sm">📸 인스타</a>
              <a href="#" target="_blank" class="py-2.5 bg-slate-800 text-white rounded-xl text-xs md:text-sm font-bold text-center hover:bg-slate-900 transition shadow-sm">📝 신청서</a>
            </div>
          </div>
        `;
      });

      quizContainer.innerHTML = `
        <div class="text-center animate-fade-in">
          <div class="text-5xl mb-3">🎉</div>
          <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-2">당신에게 이런 동아리들이 어울릴 것 같아요!</h2>
          <p class="text-sm md:text-base text-gray-500 mb-8">회원님의 성향 분석을 바탕으로 추천해 드리는 동아리 리스트입니다.</p>
          
          <!-- 카드 3개 레이아웃 (PC 3열 / 모바일 1열) -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5 text-left mb-8">
            ${clubsHtml}
          </div>

          <!-- 이벤트 안내 바 -->
          <div class="bg-emerald-100/80 border border-emerald-300 p-4 rounded-2xl mb-6 text-xs md:text-sm text-emerald-900 font-medium">
            📸 <b>이 화면을 캡처해서</b> 총동아리연합회 부스로 오시면 이벤트 뽑기권/상품을 드립니다!
          </div>

          <button onclick="restartQuiz()" class="w-full max-w-md mx-auto block py-3.5 bg-emerald-700 text-white rounded-2xl font-bold hover:bg-emerald-800 transition shadow-lg text-base">
            🔄 다시 테스트하기
          </button>
        </div>
      `;
    }

    function restartQuiz() {
      currentIdx = 0;
      scores = { '체육': 0, '문화': 0, '봉사': 0, '종교': 0 };
      renderQuestion();
    }

    // 초기 실행
    renderQuestion();
  </script>
</body>
