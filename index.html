        options: [
          { text: "상품이 걸린 미니 게임/체육 경기 부스", type: "체육" },
          { text: "버스킹 공연이나 전시회가 열리는 예술 부스", type: "문화" },
          { text: "맛있는 음식을 파는 주점이나 보드게임 부스", type: "문화" },
          { text: "수익금을 좋은 곳에 기부하는 릴레이 나눔 부스", type: "봉사" }
        ]
      },
      {
        q: "Q9. 당신을 가장 잘 표현하는 단어 하나를 고른다면?",
        options: [
          { text: "열정 (Action)", type: "체육" },
          { text: "감성 (Sensibility)", type: "문화" },
          { text: "친목 (Social)", type: "문화" },
          { text: "선의 (Kindness)", type: "봉사" }
        ]
      }
    ];

    let currentIdx = 0;
    let scores = { '체육': 0, '문화': 0, '봉사': 0, '종교': 0 };

    function updateProgress() {
      const percent = ((currentIdx + 1) / questions.length) * 100;
      document.getElementById('progress').style.width = percent + '%';
    }

    function renderQuestion() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.className = "max-w-2xl mx-auto";

      document.getElementById('progress-wrapper').style.display = 'block';
      if (currentIdx >= questions.length) {
        showResult();
        return;
      }

      updateProgress();
      const qData = questions[currentIdx];

      let optionsHtml = '';
      qData.options.forEach((opt) => {
        optionsHtml += `
          <button onclick="handleAnswer('${opt.type}')" class="w-full text-left p-4 bg-gray-50 border border-gray-200 rounded-2xl font-medium text-gray-700 hover:bg-emerald-50 hover:border-emerald-400 hover:text-emerald-700 transition text-base md:text-lg shadow-sm">
            ${opt.text}
          </button>
        `;
      });

      quizContainer.innerHTML = `
        <span class="text-sm font-bold text-emerald-600 mb-2 block">QUESTION ${currentIdx + 1} / ${questions.length}</span>
        <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-6 leading-snug">${qData.q}</h2>
        <div class="space-y-3">
          ${optionsHtml}
        </div>
      `;
    }

    function handleAnswer(type) {
      scores[type]++;
      currentIdx++;
      renderQuestion();
    }

    function showResult() {
      document.getElementById('progress-wrapper').style.display = 'none';

      const quizContainer = document.getElementById('quiz-container');
      quizContainer.className = "w-full";

      let sortedCategories = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      let topCategory = sortedCategories[0];
      let secondCategory = sortedCategories[1];

      let recommendedClubs = [...clubDatabase[topCategory]];
      if (recommendedClubs.length < 3) {
        recommendedClubs = recommendedClubs.concat(clubDatabase[secondCategory]);
      }
      
      recommendedClubs.sort(() => 0.5 - Math.random());
      let selectedClubs = recommendedClubs.slice(0, 3);

      let clubsHtml = '';
      selectedClubs.forEach(club => {
        clubsHtml += `
          <div class="bg-emerald-50/70 p-5 md:p-6 rounded-2xl border border-emerald-200/80 flex flex-col justify-between shadow-sm hover:shadow-md transition">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold bg-emerald-200/80 text-emerald-800 px-3 py-1 rounded-full">${topCategory} 분과</span>
              </div>
              <h3 class="text-xl font-extrabold text-gray-900 mb-1">${club.name}</h3>
              <p class="text-xs font-semibold text-emerald-700 mb-3">📍 ${club.loc}</p>
              
              <!-- whitespace-pre-line이 들어가 있어 \n이 실제 줄바꿈으로 출력됩니다 -->
              <p class="text-xs md:text-sm text-gray-600 leading-relaxed bg-white/80 p-3 rounded-xl border border-emerald-100 mb-4 whitespace-pre-line">
                ${club.desc}
              </p>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-emerald-100">
              <a href="#" target="_blank" class="py-2.5 bg-pink-500 text-white rounded-xl text-xs md:text-sm font-bold text-center hover:bg-pink-600 transition shadow-sm">📸 인스타</a>
              <a href="#" target="_blank" class="py-2.5 bg-slate-800 text-white rounded-xl text-xs md:text-sm font-bold text-center hover:bg-slate-900 transition shadow-sm">📝 신청서</a>
            </div>
          </div>
        `;
      });

      quizContainer.innerHTML = `
        <div class="text-center animate-fade-in">
          <div class="text-5xl mb-3">🎉</div>
          <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-2">당신에게 이런 동아리들이 어울릴 것 같아요!</h2>
          <p class="text-sm md:text-base text-gray-500 mb-8">회원님의 성향 분석을 바탕으로 추천해 드리는 동아리 리스트입니다.</p>
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5 text-left mb-8">
            ${clubsHtml}
          </div>

          <div class="bg-emerald-100/80 border border-emerald-300 p-4 rounded-2xl mb-6 text-xs md:text-sm text-emerald-900 font-medium">
            📸 <b>이 화면을 캡처해서</b> 총동아리연합회 부스로 오시면 이벤트 뽑기권/상품을 드립니다!
          </div>

          <button onclick="restartQuiz()" class="w-full max-w-md mx-auto block py-3.5 bg-emerald-700 text-white rounded-2xl font-bold hover:bg-emerald-800 transition shadow-lg text-base">
            🔄 다시 테스트하기
          </button>
        </div>
      `;
    }

    function restartQuiz() {
      currentIdx = 0;
      scores = { '체육': 0, '문화': 0, '봉사': 0, '종교': 0 };
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
