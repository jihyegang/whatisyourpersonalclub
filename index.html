<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나에게 딱 맞는 동아리 찾기 | 건양대 총동아리연합회</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

  <!-- 결과 화면에서 여유롭게 보일 수 있도록 max-w-2xl로 너비 확장 -->
  <div id="main-card" class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden p-8 relative transition-all duration-300">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <span class="text-xs font-semibold bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">2026 건양대학교 한솔대동</span>
      <h1 class="text-3xl font-bold text-gray-800 mt-2">🎯 나에게 딱 맞는<br>동아리 찾기</h1>
    </div>

    <!-- Progress Bar -->
    <div id="progress-wrapper" class="w-full bg-gray-200 h-2 rounded-full mb-8 overflow-hidden">
      <div id="progress" class="bg-emerald-500 h-full w-[11%] transition-all duration-300"></div>
    </div>

    <!-- Dynamic Content Area -->
    <div id="quiz-container">
      <!-- Questions & Results will be rendered here dynamically -->
    </div>

  </div>

  <script>
    // 제공된 이미지 데이터를 기반으로 정리한 동아리 DB (소울메이트 제외)[cite: 1]
    const clubDatabase = {
      '체육': [
        { name: 'block', loc: '짐나지움 202' },
        { name: 'MARS', loc: '짐나지움 313' },
        { name: 'NF', loc: '명곡의학관 B05' },
        { name: 'RacketS', loc: '명곡의학관 B06' },
        { name: '럭키즈', loc: '미정 (신규)' },
        { name: '런하이', loc: '미정 (신규)' },
        { name: '만두전골', loc: '미정 (가동아리)' },
        { name: '볼매', loc: '미정 (가동아리)' },
        { name: '스매쉬', loc: '미정 (가동아리)' },
        { name: '위스키', loc: '미정 (신규)' },
        { name: '인터셉트', loc: '명곡의학관 B04' },
        { name: '태산무언', loc: '미정 (가동아리)' },
        { name: '황검회', loc: '명곡의학관 B09' }
      ],
      '문화': [
        { name: 'HENNIS', loc: '짐나지움 318/319/320' },
        { name: 'MUSE', loc: '명곡의학관 B02' },
        { name: 'RIP', loc: '미정' },
        { name: '난공불락', loc: '명곡의학관 B08' },
        { name: '노말피플', loc: '명곡의학관 B03' },
        { name: '메디씨네', loc: '미정' },
        { name: '메타스타시스', loc: '명곡의학관 B06' },
        { name: '보들보들', loc: '명곡의학관 B10' },
        { name: '일루션', loc: '짐나지움 204' },
        { name: '제식이', loc: '짐나지움 207/208' },
        { name: '주MONY', loc: '명곡의학관 B08' },
        { name: '천지음', loc: '명곡의학관 B11' },
        { name: '클레프', loc: '명곡의학관 B03' },
        { name: '포토박스', loc: '짐나지움 302' },
        { name: '엉거크루', loc: '짐나지움 303' },
        { name: '후룩', loc: '명곡의학관 B04' }
      ],
      '봉사': [
        { name: '감염예방동아리', loc: '미정' },
        { name: '사랑의 RCY', loc: '명곡의학관 B07' },
        { name: '새마을봉사동아리', loc: '미정' },
        { name: '심봉사', loc: '명곡의학관 B11' },
        { name: '아름드리', loc: '명곡의학관 B05' },
        { name: '품앗이', loc: '짐나지움 314' }
      ],
      '종교': [
        { name: 'CCC', loc: '짐나지움 316/317' },
        { name: 'CMF', loc: '명곡의학관 B12' },
        { name: 'DFC', loc: '짐나지움 315' },
        { name: 'JDM', loc: '짐나지움 310' },
        { name: 'LUX(룩스)', loc: '명곡의학관 203' },
        { name: '에파타', loc: '짐나지움 321' }
      ]
    };

    // 9개의 질문 데이터 (A: 체육, B: 문화, C: 친목/문화, D: 봉사)
    const questions = [
      {
        q: "Q1. 금요일 마지막 수업이 끝난 후, 당신이 꿈꾸는 완벽한 저녁은?",
        options: [
          { text: "땀 뻘뻘 흘리며 사람들과 함께 에너지를 발산하기", type: "체육" },
          { text: "조용한 곳에서 나만의 감성이나 취미에 몰입하기", type: "문화" },
          { text: "마음 맞는 사람들과 시원한 음료 한 잔 나누며 수다 떨기", type: "문화" },
          { text: "보람찬 일로 하루를 마무리하며 남을 돕기", type: "봉사" }
        ]
      },
      {
        q: "Q2. 새로운 모임이나 그룹에 들어갔을 때 당신의 모습은?",
        options: [
          { text: "먼저 분위기를 주도하며 사람들을 끌어모는다.", type: "체육" },
          { text: "조용히 관찰하다가 친해진 몇몇과 깊게 교류한다.", type: "문화" },
          { text: "모두가 즐거울 수 있도록 뒤에서 묵묵히 지원하고 챙겨준다.", type: "봉사" },
          { text: "공통의 목표나 미션이 주어졌을 때 열정이 타오른다.", type: "종교" }
        ]
      },
      {
        q: "Q3. 스트레스가 극에 달했을 때, 가장 끌리는 해소법은?",
        options: [
          { text: "몸을 격렬하게 움직이거나 소리를 지른다.", type: "체육" },
          { text: "음악을 듣거나 무언가를 새로 만들어내며 마음을 다스린다.", type: "문화" },
          { text: "친구들과 모여 게임을 하거나 영화를 보며 딴생각을 한다.", type: "문화" },
          { text: "마음의 평화를 찾을 수 있는 차분하고 영적인 시간에 집중한다.", type: "종교" }
        ]
      },
      {
        q: "Q4. 과제나 팀 프로젝트를 할 때 당신의 강점은?",
        options: [
          { text: "탁월한 순발력과 행동력으로 빠르게 기획하고 실행하기", type: "체육" },
          { text: "남다른 감각과 디테일로 완성도 높이기", type: "문화" },
          { text: "팀원들의 의견을 경청하고 조화롭게 중재하기", type: "봉사" },
          { text: "약자를 배려하고 꼼꼼하게 챙기는 포용력", type: "봉사" }
        ]
      },
      {
        q: "Q5. 주말에 야외로 나갈 때, 당신이 꼭 챙기는 것은?",
        options: [
          { text: "편안한 운동화와 넘치는 체력", type: "체육" },
          { text: "카메라, 이어폰, 또는 나만의 감성 아이템", type: "문화" },
          { text: "여럿이 나누어 먹을 간식과 유쾌한 입담", type: "문화" },
          { text: "나보다 주변을 챙길 수 있는 여유로운 마음", type: "봉사" }
        ]
      },
      {
        q: "Q6. 당신이 생각하는 '대학 생활의 낭만'이란?",
        options: [
          { text: "동료들과 함께 땀 흘리고 눈물 흘리는 뜨거운 도전에 참여하는 것", type: "체육" },
          { text: "무대 위나 작품 속에서 나만의 개성을 마음껏 표현해보는 것", type: "문화" },
          { text: "다양한 학과의 사람들과 끈끈한 인맥을 쌓고 추억을 만드는 것", type: "문화" },
          { text: "내 작은 손길로 누군가의 삶이나 사회에 긍정적인 변화를 주는 것", type: "봉사" }
        ]
      },
      {
        q: "Q7. 낯선 사람과 대화할 때 당신이 주로 건네는 말은?",
        options: [
          { text: "\"요즘 운동이나 활동적인 거 하시는 거 있으세요?\"", type: "체육" },
          { text: "\"혹시 어떤 음악/장르 좋아하세요?\"", type: "문화" },
          { text: "\"오늘 저녁에 맛있는 거 먹으러 갈래요?\"", type: "문화" },
          { text: "\"요즘 고민이나 힘든 일은 없으세요?\"", type: "봉사" }
        ]
      },
      {
        q: "Q8. 축제 기간 부스 체험을 한다면 가장 먼저 가고 싶은 곳은?",
        options: [
          { text: "상품이 걸린 미니 게임/체육 경기 부스", type: "체육" },
          { text: "버스킹 공연이나 전시회가 열리는 예술 부스", type: "문화" },
          { text: "맛있는 음식을 파는 주점이나 보드게임 부스", type: "문화" },
          { text: "수익금을 좋은 곳에 기부하는 릴레이 나눔 부스", type: "봉사" }
        ]
      },
      {
        q: "Q9. 당신을 가장 잘 표현하는 단어 하나를 고른다면?",
        options: [
          { text: "열정 (Action)", type: "체육" },
          { text: "감성 (Sensibility)", type: "문화" },
          { text: "친목 (Social)", type: "문화" },
          { text: "선의 (Kindness)", type: "봉사" }
        ]
      }
    ];

    let currentIdx = 0;
    let scores = { '체육': 0, '문화': 0, '봉사': 0, '종교': 0 };

    function updateProgress() {
      const percent = ((currentIdx + 1) / questions.length) * 100;
      document.getElementById('progress').style.width = percent + '%';
    }

    function renderQuestion() {
      document.getElementById('progress-wrapper').style.display = 'block';
      if (currentIdx >= questions.length) {
        showResult();
        return;
      }

      updateProgress();
      const qData = questions[currentIdx];
      const container = document.getElementById('quiz-container');

      let optionsHtml = '';
      qData.options.forEach((opt) => {
        optionsHtml += `
          <button onclick="handleAnswer('${opt.type}')" class="w-full text-left p-4 bg-gray-50 border border-gray-200 rounded-xl font-medium text-gray-700 hover:bg-emerald-50 hover:border-emerald-400 hover:text-emerald-700 transition text-base">
            ${opt.text}
          </button>
        `;
      });

      container.innerHTML = `
        <span class="text-sm font-bold text-emerald-600 mb-2 block">QUESTION ${currentIdx + 1} / ${questions.length}</span>
        <h2 class="text-xl font-bold text-gray-800 mb-6">${qData.q}</h2>
        <div class="space-y-3">
          ${optionsHtml}
        </div>
      `;
    }

    function handleAnswer(type) {
      scores[type]++;
      currentIdx++;
      renderQuestion();
    }

    function showResult() {
      // 결과 화면 진입 시 진행바 숨김 및 컨테이너 넓이 확장 연출 가능
      document.getElementById('progress-wrapper').style.display = 'none';

      // 점수가 가장 높은 상위 2개 분과 추출 (또는 1위 분과 중심)
      let sortedCategories = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      let topCategory = sortedCategories[0];
      let secondCategory = sortedCategories[1];

      // 해당 분과의 동아리 목록 가져오기 (각 분과에서 무작위 혹은 최대 3~4개 선별)
      let recommendedClubs = [...clubDatabase[topCategory]];
      // 만약 동아리가 부족하면 두 번째 분과에서도 일부 가져오기
      if (recommendedClubs.length < 3) {
        recommendedClubs = recommendedClubs.concat(clubDatabase[secondCategory]);
      }
      
      // 랜덤하게 섞어서 3개 정도만 추리기
      recommendedClubs.sort(() => 0.5 - Math.random());
      let selectedClubs = recommendedClubs.slice(0, 3);

      const container = document.getElementById('quiz-container');

      let clubsHtml = '';
      selectedClubs.forEach(club => {
        clubsHtml += `
          <div class="bg-emerald-50/60 p-4 rounded-xl border border-emerald-200 flex flex-col justify-between">
            <div>
              <span class="text-xs font-bold bg-emerald-200 text-emerald-800 px-2.5 py-0.5 rounded-full">${topCategory} 분과</span>
              <h3 class="text-lg font-bold text-gray-900 mt-2">${club.name}</h3>
              <p class="text-xs text-gray-500 mt-1">📍 동아리방: ${club.loc}</p>
            </div>
            <div class="mt-4 flex gap-2">
              <a href="#" target="_blank" class="flex-1 py-1.5 bg-pink-500 text-white rounded-lg text-xs font-bold text-center hover:bg-pink-600 transition">인스타</a>
              <a href="#" target="_blank" class="flex-1 py-1.5 bg-gray-800 text-white rounded-lg text-xs font-bold text-center hover:bg-gray-900 transition">신청서</a>
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="text-center animate-fade-in">
          <div class="text-4xl mb-2">🎉</div>
          <h2 class="text-2xl font-extrabold text-gray-900 mb-1">당신에게 이런 동아리들이 어울릴 것 같아요!</h2>
          <p class="text-sm text-gray-500 mb-6">회원님의 성향 분석을 바탕으로 추천해 드리는 동아리 리스트입니다.</p>
          
          <!-- 추천 동아리 3개 카드 그리드 배치 (가로 확장형태) -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-left mb-6">
            ${clubsHtml}
          </div>

          <div class="bg-emerald-100 border border-emerald-300 p-3 rounded-xl mb-6 text-xs text-emerald-900">
            📸 <b>이 화면을 캡처해서</b> 총동아리연합회 부스로 오시면 이벤트 뽑기권/상품을 드립니다!
          </div>

          <button onclick="restartQuiz()" class="w-full py-3 bg-emerald-700 text-white rounded-xl font-bold hover:bg-emerald-800 transition shadow-md">
            🔄 다시 테스트하기
          </button>
        </div>
      `;
    }

    function restartQuiz() {
      currentIdx = 0;
      scores = { '체육': 0, '문화': 0, '봉사': 0, '종교': 0 };
      renderQuestion();
    }

    // 초기 실행
    renderQuestion();
  </script>
</body>
</html>
